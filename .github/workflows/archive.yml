name: TMD Radar Archive Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch = เก็บภาพตามปกติ | repair = ซ่อมเวลาที่ OCR อ่านผิด'
        type: choice
        options: [fetch, repair]
        default: fetch
      repeat:
        description: 'วนเช็กกี่รอบใน job เดียว (เฉพาะรันมือถือ/manual)'
        default: '1'

permissions:
  contents: write

jobs:
  fetch-and-archive:
    runs-on: ubuntu-latest
    if: vars.PIPELINE_ENABLED != 'false' || github.event.inputs.mode == 'repair'
    timeout-minutes: 10
    concurrency:
      group: radar-archive
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # ดึงเฉพาะ commit ล่าสุด ประหยัดเวลาดาวน์โหลด

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr
          version: 1.0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # โหมดอัตโนมัติจะสั่ง fetch 1 รอบแล้วไปทำ Nowcast ทันที ไม่ต้อง sleep แช่ 9 นาที
      - name: Fetch and Process Radar Frame
        if: ${{ github.event.inputs.mode != 'repair' }}
        run: |
          python -m radar_archive.cli --station PHS fetch \
            --repeat "${{ github.event.inputs.repeat || 1 }}" \
            --interval 15 \
            --outputs alpha,solid \
            --background 0,0,0

      - name: Repair Archive (manual only)
        if: ${{ github.event.inputs.mode == 'repair' }}
        run: |
          python -m radar_archive.cli --station PHS repair --apply

      - name: Nowcast (extrapolation, 60 min)
        if: ${{ github.event.inputs.mode != 'repair' }}
        continue-on-error: true
        run: |
          python -m radar_archive.nowcast --station PHS --out docs/nowcast/PHS

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ docs/nowcast/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          MSG="archive: update radar data + nowcast [skip ci]"
          if [ "${{ github.event.inputs.mode }}" = "repair" ]; then
            MSG="repair: fix OCR timestamps, drop duplicate frames, rebuild index [skip ci]"
          fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push รอบที่ $i ไม่สำเร็จ รออีก 10 วินาที"
            sleep 10
          done
          echo "::error::push ไม่สำเร็จหลังจากลอง 3 ครั้ง"
          exit 1
