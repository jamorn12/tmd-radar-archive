name: archive-radar

on:
  schedule:
    # ทุก 15 นาที — แต่ GitHub Actions หน่วงได้ 5-15 นาทีในช่วง peak
    # จึงให้แต่ละ job วนเช็กหลายรอบ (--repeat) เพื่อไม่พลาดเฟรม
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      repeat:
        description: "จำนวนรอบที่เช็กใน 1 job"
        default: "4"
      force:
        description: "ประมวลผลใหม่แม้เป็นเฟรมซ้ำ"
        type: boolean
        default: false

concurrency:
  group: archive-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ติดตั้ง tesseract (อ่านเวลาจาก footer ของภาพ)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: ติดตั้ง dependencies
        run: pip install -r requirements.txt

      - name: เช็กว่าตั้งค่า Google Drive ไว้หรือยัง
        id: cfg
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -n "$RCLONE_CONF" ]; then
            echo "drive=true" >> "$GITHUB_OUTPUT"
          else
            echo "drive=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ยังไม่ได้ตั้ง secret RCLONE_CONF — จะเก็บไว้บน repo อย่างเดียว ไม่ prune"
          fi

      - name: ดึงภาพ + ตัด background
        run: |
          python -m radar_archive.cli fetch \
            --repeat "${{ inputs.repeat || 4 }}" \
            --interval 180 \
            --outputs alpha,solid \
            --background 0,0,0 \
            ${{ inputs.force && '--force' || '' }}

      # ---- Google Drive คือ archive ตัวจริง (เก็บถาวร) ----
      - name: Sync ขึ้น Google Drive
        if: steps.cfg.outputs.drive == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DRIVE_REMOTE: ${{ vars.DRIVE_REMOTE || 'gdrive:TMD_Radar_Archive' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" | base64 -d > ~/.config/rclone/rclone.conf
          for d in raw processed log masks; do
            [ -d "data/$d" ] && rclone copy "data/$d" "$DRIVE_REMOTE/$d" \
              --transfers 8 --checkers 16 --retries 3 -q
          done

      # ---- repo เก็บแค่ 7 วันล่าสุด (prune เฉพาะเมื่อ sync ขึ้น Drive แล้วเท่านั้น) ----
      - name: ลบไฟล์เก่าออกจาก repo
        if: steps.cfg.outputs.drive == 'true'
        run: python -m radar_archive.cli prune --keep-days 7

      - name: Commit ผลลัพธ์
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
            exit 0
          fi
          git commit -m "archive: $(date -u '+%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "push ไม่สำเร็จหลังลอง 3 ครั้ง"
          exit 1
