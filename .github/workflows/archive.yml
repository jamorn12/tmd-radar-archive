name: TMD Radar Archive Pipeline

on:
  workflow_dispatch:

jobs:
  fetch-and-archive:
    runs-on: ubuntu-latest
    concurrency:
      group: radar-archive
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" "opencv-python-headless<5.0" pillow pytesseract requests
          pip install google-api-python-client google-auth

      - name: Fetch and Process Radar Frame
        run: |
          python -m radar_archive.cli --station PHS fetch

      - name: Upload New Frames to Google Drive (5 TB)
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python upload_to_gdrive.py

      - name: Prune Local Git Images Older Than 24h (Rolling Cache)
        run: |
          find data/raw data/processed -type f \( -name "*.jpg" -o -name "*.png" \) -mtime +1 -exec git rm -f {} + || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "archive: sync frames & upload to drive [skip ci]"
            git push origin main
          fi
