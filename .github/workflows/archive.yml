name: Archive TMD radar data

on:
  schedule:
    # รันทุก 15 นาทีตามปกติ
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Poll and fetch radar data
        run: |
          # วนลูปสูงสุด 25 ครั้ง ครั้งละ 30 วินาที (รวมประมาณ 12.5 นาที)
          MAX_ATTEMPTS=25
          SLEEP_SEC=30

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo "--- Attempt $i of $MAX_ATTEMPTS ($(date -u +'%H:%M:%S UTC')) ---"
            
            # เรียกดึงภาพเรดาร์
            python -m radar_archive.cli --station PHS fetch

            # เช็คว่ามีภาพใหม่เพิ่มเข้ามาใน data/ หรือไม่
            git add data/
            if ! git diff --staged --quiet; then
              echo ">>> Found new radar image! Committing and pushing..."
              git commit -m "archive: update radar data [skip ci]"
              git push
              echo ">>> Successfully archived new data. Exiting immediately."
              exit 0
            fi

            echo "No new image yet. Waiting $SLEEP_SEC seconds before next check..."
            sleep $SLEEP_SEC
          done

          echo "Timeout reached: TMD did not update any new image during this window."
