name: TMD Radar Archive Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch = เก็บภาพตามปกติ | repair = ซ่อมเวลาที่ OCR อ่านผิด'
        type: choice
        options: [fetch, repair]
        default: fetch
      repeat:
        description: 'วนเช็กกี่รอบใน job เดียว (เฉพาะรันมือถือ/manual)'
        default: '1'
      engine:
        description: 'motion engine: auto = ใช้ pysteps ถ้ามี | light = block matching ของเรา'
        type: choice
        options: [auto, light, pysteps]
        default: auto
      gauges:
        description: 'เก็บข้อมูลสถานีวัดน้ำฝนภาคพื้น (สสน.) รอบนี้ด้วยหรือไม่'
        type: choice
        options: ['yes', 'no']
        default: 'yes'

permissions:
  contents: write

jobs:
  fetch-and-archive:
    runs-on: ubuntu-latest
    if: vars.PIPELINE_ENABLED != 'false' || github.event.inputs.mode == 'repair'
    timeout-minutes: 10
    concurrency:
      group: radar-archive
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # ดึงเฉพาะ commit ล่าสุด ประหยัดเวลาดาวน์โหลด

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr
          version: 1.0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ยืนยันว่า optical flow พร้อมใช้จริง ไม่ใช่เงียบ ๆ ตกไป light ทุกรอบ
      - name: Verify Motion Engine
        if: ${{ github.event.inputs.mode != 'repair' }}
        run: |
          python - <<'PY'
          import importlib.metadata as md
          try:
              from pysteps.motion.lucaskanade import dense_lucaskanade   # noqa: F401
              from pysteps.extrapolation import semilagrangian           # noqa: F401
              print(f"::notice::pysteps {md.version('pysteps')} พร้อมใช้ — engine=auto จะใช้ optical flow")
          except Exception as e:
              print(f"::warning::pysteps ใช้ไม่ได้ ({type(e).__name__}: {e}) — จะตกไปใช้ engine=light")
          PY

      # โหมดอัตโนมัติจะสั่ง fetch 1 รอบแล้วไปทำ Nowcast ทันที ไม่ต้อง sleep แช่ 9 นาที
      - name: Fetch and Process Radar Frame
        if: ${{ github.event.inputs.mode != 'repair' }}
        run: |
          python -m radar_archive.cli --station PHS fetch \
            --repeat "${{ github.event.inputs.repeat || 1 }}" \
            --interval 15 \
            --outputs alpha,solid \
            --background 0,0,0

      - name: Repair Archive (manual only)
        if: ${{ github.event.inputs.mode == 'repair' }}
        run: |
          python -m radar_archive.cli --station PHS repair --apply

      # continue-on-error ทำให้ step นี้พังแบบเงียบ ๆ -> ต้องมี ::warning:: ให้เห็นที่หน้าสรุป run
      - name: Nowcast (extrapolation)
        if: ${{ github.event.inputs.mode != 'repair' }}
        continue-on-error: true
        run: |
          python -m radar_archive.nowcast --station PHS \
            --engine "${{ github.event.inputs.engine || 'auto' }}" \
            --out docs/nowcast/PHS \
            || echo "::warning::Nowcast ล้มเหลวรอบนี้ — เว็บจะยังแสดงผลรอบก่อน ตรวจ log ของ step นี้"

      # gauge เป็นแหล่งภายนอก (สสน.) และ **ไม่ใช่ input ของ nowcast**
      # ถ้าดึงไม่ได้ ต้องไม่กระทบ pipeline หลัก -> continue-on-error + || echo
      # วางไว้ท้ายสุดก่อน commit โดยตั้งใจ: งานที่ขาดได้ ต้องไม่กินเวลาของงานที่ขาดไม่ได้
      - name: Collect Rain Gauges (HII / thaiwater.net)
        if: ${{ github.event.inputs.mode != 'repair' && github.event.inputs.gauges != 'no' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -m radar_archive.gauges --station PHS --quiet \
            || echo "::warning::ดึงข้อมูล gauge ไม่สำเร็จรอบนี้ — เรดาร์และ nowcast ไม่กระทบ"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ docs/nowcast/ docs/gauges/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          MSG="archive: update radar data + nowcast [skip ci]"
          if [ "${{ github.event.inputs.mode }}" = "repair" ]; then
            MSG="repair: fix OCR timestamps, drop duplicate frames, rebuild index [skip ci]"
          fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push รอบที่ $i ไม่สำเร็จ รออีก 10 วินาที"
            sleep 10
          done
          echo "::error::push ไม่สำเร็จหลังจากลอง 3 ครั้ง"
          exit 1
