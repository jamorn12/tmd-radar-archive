name: TMD Radar Archive Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch = เก็บภาพตามปกติ | repair = ซ่อมเวลาที่ OCR อ่านผิด'
        type: choice
        options: [fetch, repair]
        default: fetch
      repeat:
        description: 'วนเช็กกี่รอบใน job เดียว (เฉพาะรันมือถือ/manual)'
        default: '1'
      engine:
        description: 'motion engine: auto = ใช้ pysteps ถ้ามี | light = block matching ของเรา'
        type: choice
        options: [auto, light, pysteps]
        default: auto
      gauges:
        description: 'เก็บข้อมูลสถานีวัดน้ำฝนภาคพื้น (สสน.) รอบนี้ด้วยหรือไม่'
        type: choice
        options: ['yes', 'no']
        default: 'yes'

permissions:
  contents: write

jobs:
  fetch-and-archive:
    runs-on: ubuntu-latest
    if: vars.PIPELINE_ENABLED != 'false' || github.event.inputs.mode == 'repair'
    timeout-minutes: 10
    concurrency:
      group: radar-archive
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # ดึงเฉพาะ commit ล่าสุด ประหยัดเวลาดาวน์โหลด

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr
          version: 1.0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ยืนยันว่า optical flow พร้อมใช้จริง ไม่ใช่เงียบ ๆ ตกไป light ทุกรอบ
      - name: Verify Motion Engine
        if: ${{ github.event.inputs.mode != 'repair' }}
        run: |
          python - <<'PY'
          import importlib.metadata as md
          try:
              from pysteps.motion.lucaskanade import dense_lucaskanade   # noqa: F401
              from pysteps.extrapolation import semilagrangian           # noqa: F401
              print(f"::notice::pysteps {md.version('pysteps')} พร้อมใช้ — engine=auto จะใช้ optical flow")
          except Exception as e:
              print(f"::warning::pysteps ใช้ไม่ได้ ({type(e).__name__}: {e}) — จะตกไปใช้ engine=light")
          PY

      # โหมดอัตโนมัติจะสั่ง fetch 1 รอบแล้วไปทำ Nowcast ทันที ไม่ต้อง sleep แช่ 9 นาที
      - name: Fetch and Process Radar Frame
        if: ${{ github.event.inputs.mode != 'repair' }}
        run: |
          python -m radar_archive.cli --station PHS fetch \
            --repeat "${{ github.event.inputs.repeat || 1 }}" \
            --interval 15 \
            --outputs alpha,solid \
            --background 0,0,0

      - name: Repair Archive (manual only)
        if: ${{ github.event.inputs.mode == 'repair' }}
        run: |
          python -m radar_archive.cli --station PHS repair --apply

      # continue-on-error ทำให้ step นี้พังแบบเงียบ ๆ -> ต้องมี ::warning:: ให้เห็นที่หน้าสรุป run
      - name: Nowcast (extrapolation)
        if: ${{ github.event.inputs.mode != 'repair' }}
        continue-on-error: true
        run: |
          python -m radar_archive.nowcast --station PHS \
            --engine "${{ github.event.inputs.engine || 'auto' }}" \
            --out docs/nowcast/PHS \
            || echo "::warning::Nowcast ล้มเหลวรอบนี้ — เว็บจะยังแสดงผลรอบก่อน ตรวจ log ของ step นี้"

      # ⚠️ ขั้นตอนนี้คือสิ่งที่ทำให้ operational verification เป็นไปได้ ห้ามลบ
      #
      # docs/nowcast/PHS/f/*.png ถูก **เขียนทับทุก 15 นาที** ภาพพยากรณ์ของรอบก่อนจึง
      # หายถาวรถ้าไม่คัดลอกออกมาเก็บก่อน = ย้อนกลับไปถามไม่ได้ว่า "เมื่อวานบ่ายสอง
      # ระบบพยากรณ์ว่าอะไร แล้วจริง ๆ เกิดอะไรขึ้น" ซึ่งเป็นคำถามเดียวที่ operational
      # verification ตอบได้ และเป็นจุดขายของเปเปอร์
      #
      # verify.py archive คัดลอกไปไว้ที่ data/nowcast/<CODE>/<origin_epoch>/ เป็นสำเนา
      # ถาวร ไม่ถูกเขียนทับ · 954 origin ที่มีตอนนี้กู้มาจาก git ถ้าไม่มี step นี้
      # ตัวเลขจะหยุดนิ่งอยู่แค่นั้นตลอดไป
      #
      # วางหลัง nowcast ทันที (ก่อน gauge) เพราะอ่าน latest.json ที่ nowcast เพิ่งเขียน
      - name: Archive Forecast for Verification
        if: ${{ github.event.inputs.mode != 'repair' }}
        continue-on-error: true
        run: |
          python -m radar_archive.verify archive --station PHS \
            || echo "::warning::เก็บภาพพยากรณ์ไม่สำเร็จรอบนี้ — รอบนี้จะขาดจากชุด verify"

      # ฝนเชิงพื้นที่รายอำเภอ/ตำบล — ต้องอยู่หลัง Archive Forecast เพราะอ่านเฟรม
      # พยากรณ์ f+015..f+120 ที่ step นั้นเพิ่งคัดลอกลง data/nowcast/<CODE>/<origin>/
      #
      # รอบแรกจะช้ากว่าปกติเพราะต้องสร้าง mask จับคู่ polygon 1,790 รูปกับเซลล์กริด
      # หลังจากนั้นอ่านจาก data/areal/*_mask_241.npz ที่ commit ไว้แล้ว
      # ไฟล์ mask จึงต้องถูก commit ด้วย ไม่งั้นจะสร้างใหม่ทุกรอบเปล่า ๆ
      - name: Areal Rainfall (amphoe / tambon)
        if: ${{ github.event.inputs.mode != 'repair' }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          # --level all  (ไม่ใช่ both) — CLI เปลี่ยนตอนเพิ่มระดับจังหวัดเข้ามา
          #   ค่าเดิม both ทำให้ argparse ตาย exit 2 ตั้งแต่ยังไม่ทันเริ่มทำงาน
          #   และ continue-on-error กลบไว้จนขั้นนี้เงียบสนิทหลายรอบ
          #
          # ไม่ใส่ --quiet และเก็บ log ไว้ ถ้าล้มอีกจะเห็น error บนหน้า summary ทันที
          set -o pipefail
          if python -m radar_archive.areal --station PHS --level all --csv 2>&1 | tee /tmp/areal.log; then
            {
              echo "## ฝนเชิงพื้นที่"
              echo '```'
              grep -E '^->|เขตที่จะมีฝน|เขตในโดม' /tmp/areal.log || tail -n 15 /tmp/areal.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "## ⚠️ ฝนเชิงพื้นที่ล้มเหลว"
              echo '```'
              tail -n 40 /tmp/areal.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            echo "::warning::คำนวณฝนเชิงพื้นที่ไม่สำเร็จรอบนี้ — ดูรายละเอียดท้ายหน้า summary ของ run นี้"
          fi

      # gauge เป็นแหล่งภายนอก (สสน.) และ **ไม่ใช่ input ของ nowcast**
      # ถ้าดึงไม่ได้ ต้องไม่กระทบ pipeline หลัก -> continue-on-error + || echo
      # วางไว้ท้ายสุดก่อน commit โดยตั้งใจ: งานที่ขาดได้ ต้องไม่กินเวลาของงานที่ขาดไม่ได้
      - name: Collect Rain Gauges (HII / thaiwater.net)
        if: ${{ github.event.inputs.mode != 'repair' && github.event.inputs.gauges != 'no' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -m radar_archive.gauges --station PHS --quiet \
            || echo "::warning::ดึงข้อมูล gauge ไม่สำเร็จรอบนี้ — เรดาร์และ nowcast ไม่กระทบ"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # สร้างโฟลเดอร์ก่อน add — ขั้น Areal เป็น continue-on-error ถ้ามันล้ม
          # โฟลเดอร์จะไม่ถูกสร้าง แล้ว git add จะตายด้วย "pathspec did not match"
          # ลากให้ทั้ง workflow ล้มทั้งที่งานหลักสำเร็จไปแล้ว
          mkdir -p docs/areal data/areal
          git add -A data/ docs/nowcast/ docs/gauges/ docs/areal/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          MSG="archive: update radar data + nowcast [skip ci]"
          if [ "${{ github.event.inputs.mode }}" = "repair" ]; then
            MSG="repair: fix OCR timestamps, drop duplicate frames, rebuild index [skip ci]"
          fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push รอบที่ $i ไม่สำเร็จ รออีก 10 วินาที"
            sleep 10
          done
          echo "::error::push ไม่สำเร็จหลังจากลอง 3 ครั้ง"
          exit 1
