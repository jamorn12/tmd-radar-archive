<!--
  หน้าคลังภาพรายวัน (แบบ C) — อ่านอย่างเดียว ไม่มีเซิร์ฟเวอร์
  ดัชนี:  archive/<CODE>/calendar.json และ archive/<CODE>/<YYYY-MM-DD>.json  (สร้างโดย python -m radar_archive.dayindex)
  ภาพ:    data/nowcast/<CODE>/<epoch>/obs.png · f+030.png และ data/raw/... อ่านจาก raw.githubusercontent.com
          (GitHub Pages เผยแพร่เฉพาะ docs/ จึงอ่านภาพจาก repo ตรง ๆ แทนการคัดลอกซ้ำ)
  URL:    archive.html?d=2026-09-20&t=23:30   (แชร์ได้)   ·   ?base=<url ของ repo> ใช้ทดสอบในเครื่อง

<style>
:root{--bg:#0B1220;--card:rgba(15,23,42,.92);--line:rgba(255,255,255,.12);--text:#F8FAFC;--dim:#94A3B8;
  --accent:#38BDF8;--fc:#FB923C;--warn:#F59E0B;--ok:#10B981;--danger:#EF4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:14px;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.mono{font-family:"IBM Plex Mono",Consolas,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.k{color:var(--dim);font-size:12.5px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg>*{padding:6px 14px;border-radius:999px;color:var(--dim);font-weight:600;text-decoration:none}
.seg .on{background:var(--accent);color:#06263A}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-size:12.5px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.b-obs{background:rgba(56,189,248,.18);color:#7DD3FC}.b-fc{background:rgba(251,146,60,.18);color:#FDBA74}.b-raw{background:rgba(148,163,184,.22);color:#E2E8F0}
#top{display:flex;align-items:center;gap:14px;padding:16px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;color:var(--accent)}
.brand small{color:var(--dim);font-weight:400;font-size:13px;margin-left:6px}
#wrap{display:grid;grid-template-columns:320px minmax(0,1fr) 330px;gap:16px;padding:0 20px 20px;align-items:start}
/* calendar */
#cal{padding:14px 16px}
.mon{margin-bottom:14px}.mon h4{font-size:14px;margin-bottom:6px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.g7 .dw{font-size:11px;color:var(--dim);text-align:center}
.day{height:40px;border-radius:7px;position:relative;font-size:12px;padding:3px 5px;cursor:pointer;color:#E2E8F0;text-align:left}
.day.none{border:1px dashed #263244;color:#475569;cursor:default}
.day.blank{visibility:hidden}
.day .cb{position:absolute;left:5px;right:5px;bottom:4px;height:3px;border-radius:2px;background:rgba(15,23,42,.6)}
.day .cb i{display:block;height:100%;border-radius:2px;background:#F8FAFC}
.day.sel{outline:2px solid #F8FAFC;outline-offset:1px}
.day .ev{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.calk{font-size:11.5px;color:var(--dim);line-height:1.6}
/* player */
#mid{padding:12px 14px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#mapw{position:relative;width:100%;aspect-ratio:1/1;max-height:max(380px,calc(100vh - 330px));margin:8px auto 0;touch-action:none}
#mapw,#tlw,#film,.bar{-webkit-user-select:none;user-select:none}
#mapw svg{width:100%;height:100%;display:block}
.land{fill:#E9E5DC}.prov polyline{fill:none;stroke:#8E8A80;stroke-width:.55;stroke-linejoin:round}
.plab text{font-size:8.5px;fill:#4B4F57;text-anchor:middle;paint-order:stroke;stroke:#E9E5DC;stroke-width:2.2}
.rings circle{fill:none;stroke:#2F6F8F;stroke-width:.8;stroke-dasharray:3 3}
.rings rect{fill:rgba(15,23,42,.85);stroke:rgba(56,189,248,.5);stroke-width:.6}
.rings text{font-size:7.5px;fill:#38BDF8;text-anchor:middle;font-family:Consolas,monospace}
.site{fill:#EF4444;stroke:#fff;stroke-width:1.5}
.lbl{position:absolute;top:8px}
#lL{left:8px}#lR{right:8px}
#nodata{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
#nodata span{background:rgba(15,23,42,.85);border:1px solid var(--line);padding:8px 14px;border-radius:10px;color:#FCA5A5}
.handle{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #F8FAFC;cursor:ew-resize}
.handle i{position:absolute;top:50%;left:-16px;width:32px;height:32px;margin-top:-16px;border-radius:50%;background:#F8FAFC;color:#0F172A;display:grid;place-items:center;font-style:normal;font-weight:700}
#ply{display:flex;align-items:center;gap:12px;margin-top:10px}
.play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#06263A;display:grid;place-items:center;font-size:18px;font-weight:700;flex:none}
#tt{font-size:24px;font-weight:700;min-width:105px}
#tlw{flex:1;min-width:0}
@media (max-width:700px){#ply{flex-wrap:wrap}#tlw{order:3;flex-basis:100%}#tt{flex:1}#lay button{font-size:12.5px;padding:6px 8px}}
#tl{width:100%;height:34px;display:block;cursor:pointer}
#rg{width:100%;accent-color:#38BDF8}
#film{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:10px}
#film button{text-align:center}
#film .th{aspect-ratio:1;border-radius:50%;background:#E9E5DC;overflow:hidden;border:2px solid transparent}
#film .th img{width:100%;height:100%;display:block}
#film .th.miss{background:repeating-linear-gradient(45deg,#1E293B 0 3px,#0B1220 3px 6px)}
#film .on .th{border-color:var(--accent)}
#film span{font-size:10.5px;color:var(--dim)}
#lg{display:flex;align-items:center;gap:8px;margin-top:10px}
#lg .bar2{flex:1;display:flex;height:9px;border-radius:5px;overflow:hidden}
#lg .bar2 i{flex:1}
/* side */
#side{padding:14px 16px}
#side h4{font-size:14px;margin:14px 0 6px}
#side h4:first-child{margin-top:0}
.st{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.st b{text-align:right}
.ev2{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.5;margin-bottom:6px;cursor:pointer;width:100%;text-align:left}
.ev2 a{color:#FCD34D}
#share{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:9px;padding:8px;color:#CBD5E1}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0F172A;border:1px solid var(--line);padding:8px 14px;border-radius:10px;display:none}
@media (max-width:1150px){#wrap{grid-template-columns:1fr}#cal{order:2}#side{order:3}#mid{order:1}#film{grid-template-columns:repeat(6,1fr)}}
</style>

<body>
<div id="top">
  <div class="brand">ทันฝน<small id="stname">พิษณุโลก</small></div>
  <div class="seg"><a href="./">สด</a><span class="on">คลังภาพ</span></div>
  <span class="k">เลือกวันจากปฏิทิน แล้วเล่นภาพทั้งวัน · เวลาไทย</span>
</div>
<div id="wrap">
  <div id="cal" class="card"><span class="k">กำลังโหลดปฏิทิน…</span></div>
  <div id="mid" class="card">
    <div class="bar">
      <div class="seg" id="lay"><button data-l="raw">ภาพต้นทาง TMD</button><button data-l="qc">หลัง QC</button><button data-l="fc">พยากรณ์ที่ออก 30 นาทีก่อน</button></div>
      <div style="flex:1"></div>

    </div>

      <span class="lbl badge b-raw" id="lL">ภาพต้นทาง TMD</span>
      <span class="lbl badge b-obs" id="lR">หลัง QC</span>
      <div class="handle" id="hd"><i>⇆</i></div>

    </div>

      <button class="play" id="pb" title="เล่น / หยุด (เว้นวรรค)">▶</button>
      <div id="tt">--:--</div>
      <div id="tlw"><svg id="tl"></svg><input type="range" id="rg" min="0" max="95" value="0" aria-label="เวลา"></div>
      <div class="seg" id="spd"><button data-s="800">1×</button><button data-s="400" class="on">2×</button><button data-s="200">4×</button></div>
    </div>
    <div id="lg"><span class="k">dBZ</span><span class="k mono" id="lg0"></span><div class="bar2" id="lgb"></div><span class="k mono" id="lg1"></span></div>
    <div id="film"></div>
  </div>
  <div id="side" class="card"></div>
</div>
<div id="msg"></div>
<script>
"use strict";
const CODE = "PHS";
const Q = new URLSearchParams(location.search);
const IDX = `archive/${CODE}/`;
// raw.githubusercontent.com/<owner>/<repo>/main/  — หาจากที่อยู่ของหน้า GitHub Pages (<owner>.github.io/<repo>/)
function repoBase() {
  if (Q.get("base")) return Q.get("base").replace(/\/?$/, "/");
  const h = location.hostname, seg = location.pathname.split("/").filter(Boolean);
  if (h.endsWith(".github.io") && seg.length) return `https://raw.githubusercontent.com/${h.split(".")[0]}/${seg[0]}/main/`;
  return "https://raw.githubusercontent.com/jamorn12/tmd-radar-archive/main/";
}
const BASE = repoBase();
const NS = "http://www.w3.org/2000/svg", R_EARTH = 6371.0088, SLOT = 900;
const THM = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const THMF = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const PROV_TH = {"Phra Nakhon Si Ayutthaya":"อยุธยา","Ang Thong":"อ่างทอง","Lopburi":"ลพบุรี","Sing Buri":"สิงห์บุรี","Chainat":"ชัยนาท",
  "Saraburi":"สระบุรี","Nakhon Ratchasima":"นครราชสีมา","Chaiyaphum":"ชัยภูมิ","Nong Bua Lamphu":"หนองบัวลำภู","Khon Kaen":"ขอนแก่น",
  "Udon Thani":"อุดรธานี","Loei":"เลย","Chiang Mai":"เชียงใหม่","Lamphun":"ลำพูน","Lampang":"ลำปาง","Uttaradit":"อุตรดิตถ์","Phrae":"แพร่",
  "Nan":"น่าน","Phayao":"พะเยา","Nakhon Sawan":"นครสวรรค์","Uthai Thani":"อุทัยธานี","Kamphaeng Phet":"กำแพงเพชร","Tak":"ตาก",
  "Sukhothai":"สุโขทัย","Phitsanulok":"พิษณุโลก","Phichit":"พิจิตร","Phetchabun":"เพชรบูรณ์","Kanchanaburi":"กาญจนบุรี","Suphan Buri":"สุพรรณบุรี"};
const CONF = {high:"สูง", medium:"กลาง", low:"ต่ำ", none:"แทบไม่เคลื่อนที่"};
const OCR = {"ocr":"อ่านตรงกันทั้ง 5 แบบ","ocr-majority":"เสียงข้างมาก","ocr-weak":"คะแนนสูงสุด (ไม่ถึงครึ่ง)","ocr-repaired":"แก้ย้อนหลัง"};
const pad = n => String(n).padStart(2, "0");
const hm = t => { const d = new Date((t + 25200) * 1000); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const thDate = s => { const [y, m, d] = s.split("-").map(Number); return `${d} ${THM[m - 1]} ${y + 543}`; };
const dayStart = s => Date.UTC(...s.split("-").map((v, i) => i === 1 ? v - 1 : +v)) / 1000 - 25200;
const compass = b => ["เหนือ","ตะวันออกเฉียงเหนือ","ตะวันออก","ตะวันออกเฉียงใต้","ใต้","ตะวันตกเฉียงใต้","ตะวันตก","ตะวันตกเฉียงเหนือ"][Math.round((((b % 360) + 360) % 360) / 45) % 8];
const obsURL = t => `${BASE}data/nowcast/${CODE}/${t}/obs.png`;
const fcURL = (o, L) => `${BASE}data/nowcast/${CODE}/${o}/f+${String(L).padStart(3, "0")}.png`;
const rawURL = p => `${BASE}data/${p}`;
function el(tag, a = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; }
function toast(s) { const m = document.getElementById("msg"); m.textContent = s; m.style.display = "block"; setTimeout(() => m.style.display = "none", 2200); }
async function getJSON(u) { const r = await fetch(u, { cache: "no-cache" }); if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); }
function project(lat, lon, lat0, lon0) {        // azimuthal equidistant บนทรงกลม (เหมือนหน้าเว็บหลัก)
  const p = lat * Math.PI / 180, l = lon * Math.PI / 180, p0 = lat0 * Math.PI / 180, l0 = lon0 * Math.PI / 180;
  const cosC = Math.sin(p0) * Math.sin(p) + Math.cos(p0) * Math.cos(p) * Math.cos(l - l0);
  const c = Math.acos(Math.min(1, Math.max(-1, cosC))); if (c < 1e-9) return [0, 0];
  const k = c / Math.sin(c);
  return [R_EARTH * k * Math.cos(p) * Math.sin(l - l0), R_EARTH * k * (Math.cos(p0) * Math.sin(p) - Math.sin(p0) * Math.cos(p) * Math.cos(l - l0))];
}

let CAL, ST, DAY = null, EVENTS = [], k = 0, layer = "qc", swipe = true, split = 0.5, timer = null, speed = 400;
let M = {};

/* ───────── map */
async function buildMap() {
  const host = document.getElementById("mapw");
  const svg = el("svg", { viewBox: "-252 -252 504 504" }); host.prepend(svg);
  const defs = el("defs", {}, svg);
  el("circle", { r: ST.range_km + 1 }, el("clipPath", { id: "dome" }, defs));
  const rL = el("rect", { x: -260, y: -260, height: 520, width: 260 }, el("clipPath", { id: "cL" }, defs));
  const rR = el("rect", { x: 0, y: -260, height: 520, width: 260 }, el("clipPath", { id: "cR" }, defs));
  const g = el("g", { "clip-path": "url(#dome)" }, svg);
  el("circle", { r: ST.range_km + 1, class: "land" }, g);
  const [xw, xe, ys, yn] = ST.raw_extent_km;
  const raw = el("image", { x: xw, y: -yn, width: xe - xw, height: yn - ys, preserveAspectRatio: "none" }, g);
  const pv = el("g", { class: "prov" }, g), lab = el("g", { class: "plab" }, svg);
  try {
    const gj = await getJSON("provinces_240km.geojson");
    for (const f of gj.features) {
      const polys = f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [f.geometry.coordinates];
      let big = [];
      for (const poly of polys) for (const ring of poly) {
        const pts = ring.filter((_, i) => i % 2 === 0).map(([lon, lat]) => project(lat, lon, ST.lat, ST.lon));
        el("polyline", { points: pts.map(([x, y]) => `${x.toFixed(1)},${(-y).toFixed(1)}`).join(" ") }, pv);
        if (pts.length > big.length) big = pts;
      }
      const cx = big.reduce((s, p) => s + p[0], 0) / big.length, cy = big.reduce((s, p) => s + p[1], 0) / big.length;
      if (Math.hypot(cx, cy) < ST.range_km - 15) { const t = el("text", { x: cx, y: -cy }, lab); t.textContent = PROV_TH[f.properties.name] || f.properties.name; }
    }
  } catch (e) { console.warn("ไม่มีเส้นขอบเขตจังหวัด", e); }
  const n = ST.grid[0], half = (n - 1) / 2 * ST.kmperpixel + ST.kmperpixel / 2;
  const img = el("image", { x: -half, y: -half, width: 2 * half, height: 2 * half, preserveAspectRatio: "none" }, g);
  const rings = el("g", { class: "rings" }, svg);
  for (const r of [60, 120, ST.range_km]) {
    el("circle", { r }, rings);
    const tg = el("g", { transform: `translate(0,${-r})` }, rings);
    el("rect", { x: -17, y: -7, width: 34, height: 14, rx: 7 }, tg); el("text", { y: 3.6 }, tg).textContent = `${r} km`;
  }
  el("circle", { r: 4.5, class: "site" }, svg);
  let pending = 0;
  const nod = document.getElementById("nodata");
  function setImg(node, url) {
    if (!url) { node.removeAttribute("href"); node.style.display = "none"; return; }
    node.style.display = ""; node.setAttribute("href", url);
  }
  for (const node of [raw, img]) node.addEventListener("error", () => { node.style.display = "none"; check(); });
  function check() { const vis = [raw, img].some(n => n.style.display !== "none" && n.getAttribute("href")); nod.style.display = vis ? "none" : "grid"; }
  M = { svg, raw, img, rL, rR, setImg, check };
}

/* ───────── calendar */
function renderCal() {
  const box = document.getElementById("cal");
  const days = Object.fromEntries(CAL.days.map(d => [d.date, d]));
  const evDays = new Set(EVENTS.map(e => e.date));
  const maxKm = Math.max(1, ...CAL.days.map(d => d.max_km2));
  const first = CAL.days[0].date, last = CAL.days[CAL.days.length - 1].date;
  let [y, m] = first.split("-").map(Number); const [ly, lm] = last.split("-").map(Number);
  let html = "";
  while (y < ly || (y === ly && m <= lm)) {
    html += `<div class="mon"><h4>${THMF[m - 1]} ${y + 543}</h4><div class="g7">` + ["จ","อ","พ","พฤ","ศ","ส","อา"].map(d => `<div class="dw">${d}</div>`).join("");
    const off = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7, n = new Date(Date.UTC(y, m, 0)).getUTCDate();
    for (let i = 0; i < off; i++) html += `<div class="day blank"></div>`;
    for (let d = 1; d <= n; d++) {
      const key = `${y}-${pad(m)}-${pad(d)}`, c = days[key];
      if (!c) { html += `<div class="day none">${d}</div>`; continue; }
      const a = 0.18 + 0.82 * Math.sqrt(c.max_km2 / maxKm);
      html += `<button class="day" data-d="${key}" style="background:rgba(56,189,248,${a.toFixed(2)})"
        title="${thDate(key)} · ${c.n}/96 รอบ · พื้นที่ฝนสูงสุด ${c.max_km2.toLocaleString()} กม²">${d}${evDays.has(key) ? '<span class="ev"></span>' : ""}
        <span class="cb"><i style="width:${Math.min(100, c.n / 96 * 100).toFixed(0)}%"></i></span></button>`;
    }
    html += `</div></div>`;
    if (++m > 12) { m = 1; y++; }
  }
  html += `<div class="calk">สีเข้ม = พื้นที่ฝนสูงสุดของวันมาก · แถบขาว = รอบที่เก็บได้ (เต็ม = 96) ·
    <span style="color:var(--warn)">●</span> มีเหตุการณ์ที่ข่าวรายงาน · เส้นประ = ไม่มีข้อมูล</div>`;
  box.innerHTML = html;
  box.querySelectorAll("button.day").forEach(b => b.onclick = () => loadDay(b.dataset.d));
}

/* ───────── day */
async function loadDay(date, hhmm) {
  stop();
  DAY = await getJSON(`${IDX}${date}.json`);
  document.querySelectorAll("#cal .day").forEach(b => b.classList.toggle("sel", b.dataset.d === date));
  const cyc = DAY.cycles;
  const hasObs = cyc.some(c => c.obs), firstAny = Math.max(0, cyc.findIndex(c => c.obs || c.raw));
  if (!hasObs) { layer = "raw"; swipe = false; }          // days with TMD source images only
  if (hhmm) { const i = cyc.findIndex(c => c.hhmm === hhmm); k = i >= 0 ? i : firstAny; }
  else { const lastObs = cyc.map((c, i) => c.obs ? i : -1).filter(i => i >= 0).pop(); k = lastObs ?? firstAny; }
  renderTimeline(); renderFilm(); renderSide(); draw();
}
function renderTimeline() {
  const svg = document.getElementById("tl"); svg.innerHTML = "";
  const W = svg.clientWidth || 600, H = 34, sw = W / 96;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const mx = Math.max(1, ...DAY.cycles.map(c => c.wet_km2 || 0));
  DAY.cycles.forEach((c, i) => {
    if (!c.obs) { el("rect", { x: i * sw + .5, y: 2, width: Math.max(1, sw - 1), height: H - 4, fill: c.raw ? "rgba(148,163,184,.35)" : "rgba(239,68,68,.35)" }, svg); return; }
    const h = Math.max(2, (H - 4) * (c.wet_km2 || 0) / mx);
    el("rect", { x: i * sw + .5, y: H - 2 - h, width: Math.max(1, sw - 1), height: h, fill: "#38BDF8", opacity: .75 }, svg);
  });
  el("line", { id: "head", x1: 0, x2: 0, y1: 0, y2: H, stroke: "#F8FAFC", "stroke-width": 2 }, svg);
  svg.onclick = e => { const r = svg.getBoundingClientRect(); k = Math.min(95, Math.max(0, Math.floor((e.clientX - r.left) / r.width * 96))); draw(); };
}
function renderFilm() {
  const f = document.getElementById("film"); f.innerHTML = "";
  for (let h = 0; h < 24; h += 2) {
    const idx = [...Array(8).keys()].map(j => h * 4 + j).find(i => DAY.cycles[i] && DAY.cycles[i].obs);
    const b = document.createElement("button"); b.dataset.k = idx ?? h * 4;
    b.innerHTML = idx != null ? `<div class="th"><img loading="lazy" alt="" src="${obsURL(DAY.cycles[idx].t)}"></div><span class="mono">${DAY.cycles[idx].hhmm}</span>`
                              : `<div class="th miss"></div><span class="mono">${pad(h)}:00</span>`;
    b.onclick = () => { k = +b.dataset.k; draw(); };
    f.appendChild(b);
  }
}
function renderSide() {
  const s = DAY.summary, gaps = s.gaps.map(g => `${hm(g[0])}–${hm(g[1]) === "00:00" && g[1] > g[0] ? "24:00" : hm(g[1])}`);
  const evs = EVENTS.filter(e => e.date === DAY.date);
  document.getElementById("side").innerHTML = `
    <h4>${thDate(DAY.date)}</h4>
    <div class="st"><span class="k">รอบที่เก็บได้</span><b>${s.n_cycles} / 96 (${(s.n_cycles / 96 * 100).toFixed(1)}%)</b></div>
    <div class="st"><span class="k">ภาพต้นทาง TMD</span><b>${s.n_raw} ภาพ</b></div>
    <div class="st"><span class="k">ช่วงที่ไม่มีรอบพยากรณ์</span><b>${gaps.length ? gaps.join("<br>") : "ไม่มี"}</b></div>
    <div class="st"><span class="k">ภาพที่ตัด RFI ออก</span><b>${s.rfi_images} ภาพ</b></div>
    <div class="st"><span class="k">พื้นที่ฝนสูงสุด</span><b>${s.peak ? `${s.peak.km2.toLocaleString()} กม² · ${hm(s.peak.t)} น.` : "–"}</b></div>
    <div class="st"><span class="k">ค่าสูงสุดของวัน</span><b>${s.max_dbz != null ? s.max_dbz + " dBZ" : "–"}</b></div>
    <div class="st"><span class="k">พยากรณ์ +30 นาที ชนะ persistence</span><b>${s.n_scored30 ? `${s.wins30} / ${s.n_scored30} รอบ` : "–"}</b></div>
    <h4>รอบที่กำลังดู</h4><div id="cur"></div>
    ${evs.length ? `<h4>เหตุการณ์ที่มีข่าวรายงาน</h4>` + evs.map(e => `<button class="ev2" data-t="${e.jump || ""}"><b>${e.title}</b> ${e.detail}<br>
       <span class="k">${e.jump ? `กดเพื่อไปที่ ${e.jump} น. · ` : ""}ที่มา: <a href="${e.url}" target="_blank" rel="noopener">${e.source}</a></span></button>`).join("") : ""}
    <button id="share">🔗 คัดลอกลิงก์ของวันและเวลานี้</button>`;
  document.querySelectorAll(".ev2").forEach(b => b.onclick = e => {
    if (e.target.tagName === "A" || !b.dataset.t) return;
    const i = DAY.cycles.findIndex(c => c.hhmm === b.dataset.t); if (i >= 0) { k = i; draw(); }
  });
  document.getElementById("share").onclick = async () => {
    const u = `${location.origin}${location.pathname}?d=${DAY.date}&t=${DAY.cycles[k].hhmm}`;
    try { await navigator.clipboard.writeText(u); toast("คัดลอกลิงก์แล้ว"); } catch { prompt("คัดลอกลิงก์นี้", u); }
  };
}
function renderCur(c) {
  const box = document.getElementById("cur"); if (!box) return;
  const r = [];
  if (c.obs) {
    r.push(["พื้นที่ฝน (≥ 16.5 dBZ)", `${(c.wet_km2 || 0).toLocaleString()} กม²`], ["ค่าสูงสุด", c.max_dbz != null ? `${c.max_dbz} dBZ` : "–"]);
    if (c.motion && c.motion.kmh != null) r.push(["การเคลื่อนที่", `${c.motion.kmh} กม./ชม. ไปทาง${compass(c.motion.bearing)}`], ["ความเชื่อมั่น", CONF[c.motion.confidence] || "–"]);
    if (c.score30) r.push(["CSI +30 นาทีของรอบนี้", `${c.score30.csi.toFixed(2)} (persistence ${c.score30.csip.toFixed(2)})`]);
  } else r.push(["รอบพยากรณ์", "ไม่มีในคลัง"]);
  if (c.raw) r.push(["เวลาสแกน", OCR[c.ocr] || c.ocr || "–"], ["RFI ที่ตัดออก", c.rfi_px ? `${c.rfi_px.toLocaleString()} จุดภาพ (${c.qc_removed_pct}% ของ echo)` : "ไม่พบ"]);
  box.innerHTML = r.map(([a, b]) => `<div class="st"><span class="k">${a}</span><b>${b}</b></div>`).join("");
}

/* ───────── draw one frame */
function placeSplit() {
  const hd = document.getElementById("hd"), x = -252 + 504 * split;
  M.rL.setAttribute("width", x + 260); M.rR.setAttribute("x", x);
  hd.style.left = (split * 100) + "%";
  for (const id of ["hd", "lL", "lR"]) document.getElementById(id).style.display = swipe ? "" : "none";
}
function draw() {
  if (!DAY) return;
  const c = DAY.cycles[k];
  document.getElementById("tt").textContent = `${c.hhmm} น.`;
  document.getElementById("rg").value = k;
  const head = document.getElementById("head");
  if (head) { const W = document.getElementById("tl").viewBox.baseVal.width, x = (k + .5) * W / 96; head.setAttribute("x1", x); head.setAttribute("x2", x); }
  document.querySelectorAll("#lay button").forEach(b => b.classList.toggle("on", !swipe && b.dataset.l === layer));
  document.getElementById("swb").classList.toggle("on", swipe);
  document.querySelectorAll("#film button").forEach(b => b.classList.toggle("on", Math.floor(k / 8) === Math.floor(+b.dataset.k / 8)));
  const rawU = c.raw ? rawURL(c.raw) : null, obsU = c.obs ? obsURL(c.t) : null;
  if (swipe) {
    M.raw.setAttribute("clip-path", "url(#cL)"); M.img.setAttribute("clip-path", "url(#cR)");
    M.setImg(M.raw, rawU); M.setImg(M.img, obsU);
  } else {
    M.raw.removeAttribute("clip-path"); M.img.removeAttribute("clip-path");
    if (layer === "raw") { M.setImg(M.raw, rawU); M.setImg(M.img, null); }
    else if (layer === "qc") { M.setImg(M.raw, null); M.setImg(M.img, obsU); }
    else { M.setImg(M.raw, null); M.setImg(M.img, fcURL(c.t - 1800, 30)); }
  }
  M.check(); placeSplit(); renderCur(c);
  history.replaceState(null, "", `?d=${DAY.date}&t=${c.hhmm}${Q.get("base") ? "&base=" + encodeURIComponent(Q.get("base")) : ""}`);
  for (let j = 1; j <= 4; j++) {               // โหลดล่วงหน้า 4 รอบถัดไป ภาพจะไม่กระพริบตอนเล่น
    const n = DAY.cycles[k + j]; if (!n) break;
    if (n.obs) new Image().src = obsURL(n.t);
    if (n.raw && (swipe || layer === "raw")) new Image().src = rawURL(n.raw);
  }
}
function step(d) {
  let i = k;
  for (let n = 0; n < 96; n++) { i = (i + d + 96) % 96; const c = DAY.cycles[i]; if (c.obs || c.raw) break; }
  k = i; draw();
}
function stop() { if (timer) { clearInterval(timer); timer = null; } document.getElementById("pb").textContent = "▶"; }
function play() { stop(); document.getElementById("pb").textContent = "❚❚"; timer = setInterval(() => step(1), speed); }

/* ───────── controls */
document.getElementById("pb").onclick = () => timer ? stop() : play();
document.getElementById("rg").oninput = e => { k = +e.target.value; draw(); };
document.querySelectorAll("#lay button").forEach(b => b.onclick = () => { layer = b.dataset.l; swipe = false; draw(); });
document.getElementById("swb").onclick = () => { swipe = !swipe; draw(); };
document.querySelectorAll("#spd button").forEach(b => b.onclick = () => {
  speed = +b.dataset.s; document.querySelectorAll("#spd button").forEach(x => x.classList.toggle("on", x === b)); if (timer) play();
});
document.addEventListener("keydown", e => {
  if (!DAY || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") { stop(); step(1); } else if (e.key === "ArrowLeft") { stop(); step(-1); }
  else if (e.key === " ") { e.preventDefault(); timer ? stop() : play(); }
});
(() => {
  const w = document.getElementById("mapw"); let drag = false;
  const move = e => { if (!drag || !swipe) return; const r = w.getBoundingClientRect(); split = Math.min(.97, Math.max(.03, (e.clientX - r.left) / r.width)); placeSplit(); };
  document.getElementById("hd").addEventListener("pointerdown", e => { drag = true; e.target.setPointerCapture?.(e.pointerId); });
  w.addEventListener("pointermove", move); window.addEventListener("pointerup", () => drag = false);
  window.addEventListener("resize", () => { if (DAY) { renderTimeline(); draw(); } });
})();

/* ───────── start */
(async () => {
  try {
    CAL = await getJSON(`${IDX}calendar.json`); ST = CAL.station;
    document.getElementById("stname").textContent = ST.name_th;
    try { EVENTS = (await getJSON(`${IDX}events.json`)).events || []; } catch { EVENTS = []; }
    const lv = ST.levels_dbz, cl = ST.levels_rgb;
    document.getElementById("lgb").innerHTML = cl.map(c => `<i style="background:rgb(${c})"></i>`).join("");
    document.getElementById("lg0").textContent = lv[0]; document.getElementById("lg1").textContent = lv[lv.length - 1];
    await buildMap(); renderCal();
    const want = Q.get("d"), ok = CAL.days.some(d => d.date === want);
    const def = [...CAL.days].reverse().find(d => d.n > 0) || CAL.days[CAL.days.length - 1];
    await loadDay(ok ? want : def.date, ok ? Q.get("t") : null);
  } catch (e) {
    document.getElementById("cal").innerHTML = `<span style="color:#FCA5A5">โหลดดัชนีคลังภาพไม่ได้ (${e.message}) — ต้องรัน python -m radar_archive.dayindex ก่อน</span>`;
  }
})();
</script>
