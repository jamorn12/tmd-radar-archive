<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1524">
<title>ทันฝน — เรดาร์พิษณุโลก & Nowcast</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Fonts & Leaflet Web GIS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root {
  --card: rgba(15, 23, 42, 0.82);
  --card-line: rgba(255, 255, 255, 0.12);
  --text: #F8FAFC;
  --text-dim: #94A3B8;
  --accent: #38BDF8;
  --warn: #F59E0B;
  --ok: #10B981;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  --blur: blur(16px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; padding: 0; background: #070B12; color: var(--text); font-family: "IBM Plex Sans Thai", sans-serif; overflow: hidden; }

#map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; background: #0b1320; }

.glass {
  background: var(--card);
  border: 1px solid var(--card-line);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow);
  border-radius: 16px;
}

/* Top Bar */
.top-bar {
  position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
  display: flex; gap: 10px; align-items: center; pointer-events: none;
}
.top-bar > * { pointer-events: auto; }

.brand { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; }
.brand b { font-size: 15px; letter-spacing: -0.01em; color: var(--accent); }
.brand span { font-size: 13px; color: var(--text-dim); }

.pill { padding: 8px 14px; border-radius: 999px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

/* Basemap Switcher Widget */
.map-switch {
  display: flex; gap: 4px; padding: 4px; border-radius: 999px; margin-left: auto;
}
.map-btn {
  border: none; background: transparent; color: var(--text-dim);
  padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
}
.map-btn.active {
  background: var(--accent); color: #070B12; font-weight: 700;
}

/* Left Card (ETA) */
.rail {
  position: absolute; top: 68px; left: 12px; width: 330px; z-index: 999;
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
}
.rail > * { pointer-events: auto; }
.card { padding: 16px 18px; }
.card-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }
.eta-val { font-size: 42px; font-weight: 700; line-height: 1.1; margin: 6px 0; color: #fff; }
.eta-val small { font-size: 16px; font-weight: 400; color: var(--text-dim); margin-left: 4px; }
.eta-desc { font-size: 13px; color: var(--text-dim); line-height: 1.4; }

.btn-loc {
  width: 100%; margin-top: 12px; padding: 8px; border-radius: 10px;
  background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3);
  color: var(--accent); font-weight: 600; cursor: pointer; font-size: 13px;
}
.btn-loc:hover { background: rgba(56, 189, 248, 0.25); }

/* Slider & Opacity Tool */
.opacity-box {
  margin-top: 10px; display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--text-dim);
}
.opacity-box input { width: 140px; accent-color: var(--accent); }

/* Legend */
.legend {
  position: absolute; left: 12px; bottom: 85px; z-index: 999;
  padding: 8px 12px; border-radius: 12px; width: 220px;
}
.lg-bar {
  height: 8px; border-radius: 4px; margin: 4px 0;
  background: linear-gradient(90deg, #00ECEC 0%, #00A000 25%, #FFFF00 50%, #FF9000 75%, #FF0000 100%);
}
.lg-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); font-family: "IBM Plex Mono", monospace; }

/* Timeline Controller */
.timeline {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  width: min(620px, calc(100% - 24px)); z-index: 1000;
  padding: 10px 16px; border-radius: 18px;
}
.tl-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.tl-time { font-size: 15px; font-weight: 700; }
.tl-tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; }
.tl-tag.obs { background: rgba(16, 185, 129, 0.2); color: #34D399; }
.tl-tag.fc { background: rgba(245, 158, 11, 0.2); color: #FBBF24; }

.tl-controls { display: flex; align-items: center; gap: 12px; }
.btn-play {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: var(--accent); color: #070B12; font-size: 16px;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.track { flex: 1; accent-color: var(--accent); cursor: pointer; }

@media (max-width: 768px) {
  .rail { width: calc(100% - 24px); top: auto; bottom: 85px; }
  .legend { display: none; }
  .timeline { bottom: 8px; }
}
</style>
</head>
<body>

<div id="map"></div>

<!-- Top Bar -->
<div class="top-bar">
  <div class="brand glass">
    <b>ทันฝน</b><span>พิษณุโลก</span>
  </div>

  <div class="pill glass" id="freshPill">
    <span class="dot" id="freshDot"></span>
    <span id="freshTime">กำลังเชื่อมต่อ...</span>
  </div>

  <!-- Basemap Switcher -->
  <div class="map-switch glass">
    <button class="map-btn active" data-layer="dark">มืด</button>
    <button class="map-btn" data-layer="satellite">ดาวเทียม</button>
    <button class="map-btn" data-layer="light">สว่าง</button>
  </div>
</div>

<!-- Left Cards -->
<div class="rail">
  <div class="card glass">
    <div class="card-head">
      <span>การคาดการณ์ตำแหน่ง</span>
      <span id="userLocLabel">สถานีเรดาร์ PHS</span>
    </div>
    <div class="eta-val" id="etaMinutes">—<small>นาที</small></div>
    <div class="eta-desc" id="etaDesc">กำลังประมวลผลทิศทางกลุ่มฝน...</div>
    <button class="btn-loc" id="btnLoc">🎯 ค้นหาตำแหน่งของฉัน (ETA)</button>

    <div class="opacity-box">
      <span>ความทึบเรดาร์:</span>
      <input type="range" id="radarOpacity" min="20" max="100" value="85">
    </div>
  </div>
</div>

<!-- Legend -->
<div class="legend glass">
  <div class="lg-labels"><span>20</span><span>30</span><span>40</span><span>50</span><span>60+ dBZ</span></div>
  <div class="lg-bar"></div>
  <div class="lg-labels"><span>เบา</span><span>ปานกลาง</span><span>หนัก</span><span>หนักมาก</span></div>
</div>

<!-- Timeline Player -->
<div class="timeline glass">
  <div class="tl-top">
    <div class="tl-time" id="tlTime">—:— น.</div>
    <span class="tl-tag obs" id="tlTag">กำลังโหลด</span>
  </div>
  <div class="tl-controls">
    <button class="btn-play" id="btnPlay">▶</button>
    <input type="range" class="track" id="tlSlider" min="0" max="0" value="0">
  </div>
</div>

<script>
const MANIFEST_URL = "nowcast/PHS/latest.json";
const R_EARTH = 6371.0088;

// 1. กำหนด Basemaps ระดับสากล
const baseLayers = {
  dark: L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: "abcd", maxZoom: 19
  }),
  light: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: "abcd", maxZoom: 19
  }),
  satellite: L.tileLayer("https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}", {
    attribution: "&copy; Google Maps",
    maxZoom: 19
  })
};

// เริ่มต้นแผนที่ตรงกลางที่พิษณุโลก
const map = L.map("map", {
  center: [16.77, 100.22],
  zoom: 8,
  zoomControl: false,
  layers: [baseLayers.dark]
});

L.control.zoom({ position: "topright" }).addTo(map);

// ตัวแปรระบบเรดาร์
let manifest = null;
let radarOverlays = [];
let currentIndex = 0;
let isPlaying = false;
let playTimer = null;
let radarBounds = null;

// แปลง Azimuthal Equidistant กลับมาเป็น Lat/Lon
function unproject(E, Nn, lat0, lon0) {
  const p0 = lat0 * Math.PI / 180, l0 = lon0 * Math.PI / 180;
  const rho = Math.hypot(E, Nn);
  if (rho < 1e-9) return [lat0, lon0];
  const c = rho / R_EARTH;
  const lat = Math.asin(Math.cos(c) * Math.sin(p0) + Nn * Math.sin(c) * Math.cos(p0) / rho);
  const lon = l0 + Math.atan2(E * Math.sin(c), rho * Math.cos(p0) * Math.cos(c) - Nn * Math.sin(p0) * Math.sin(c));
  return [lat * 180 / Math.PI, lon * 180 / Math.PI];
}

// โหลดข้อมูลล่าสุด
async function initRadar() {
  try {
    const res = await fetch(MANIFEST_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("ไม่สามารถโหลด manifest ได้");
    manifest = await res.json();

    const m = /lat_0=([-\d.]+).*?lon_0=([-\d.]+)/.exec(manifest.projection) || [];
    const lat0 = parseFloat(m[1]) || 16.77;
    const lon0 = parseFloat(m[2]) || 100.22;
    const halfKm = (manifest.grid[0] - 1) * manifest.kmperpixel / 2;

    // คำนวณขอบเขตแผนที่ LatLngBounds
    const south = unproject(0, -halfKm, lat0, lon0)[0];
    const north = unproject(0, halfKm, lat0, lon0)[0];
    const west = unproject(-halfKm, 0, lat0, lon0)[1];
    const east = unproject(halfKm, 0, lat0, lon0)[1];
    radarBounds = L.latLngBounds([south, west], [north, east]);

    // วงแหวนระยะ 60, 120, 240 กม.
    [60000, 120000, 240000].forEach(r => {
      L.circle([lat0, lon0], {
        radius: r, color: "#38BDF8", weight: 1, dashArray: "4, 6", fill: false, opacity: 0.35
      }).addTo(map);
    });

    // Marker สถานี
    L.circleMarker([lat0, lon0], {
      radius: 4, color: "#38BDF8", fillColor: "#FFF", fillOpacity: 1
    }).addTo(map).bindPopup("สถานีเรดาร์พิษณุโลก (PHS)");

    // สร้าง Layer ภาพสำหรับแต่ละเฟรม
    radarOverlays = manifest.frames.map((frame, idx) => {
      const url = "nowcast/PHS/" + frame.url;
      const overlay = L.imageOverlay(url, radarBounds, {
        opacity: 0,
        interactive: false
      }).addTo(map);
      return overlay;
    });

    // Setup Timeline Slider
    const slider = document.getElementById("tlSlider");
    slider.max = manifest.frames.length - 1;
    
    // ตั้งต้นที่เฟรมปัจจุบัน (offset = 0)
    const nowIdx = manifest.frames.findIndex(f => f.offset_min === 0);
    showFrame(nowIdx >= 0 ? nowIdx : manifest.frames.length - 1);

    updateStatus();
    updateETA();
  } catch (err) {
    document.getElementById("freshTime").textContent = "เชื่อมต่อล้มเหลว";
    document.getElementById("freshDot").className = "dot warn";
  }
}

// สลับเฟรมแสดงผล
function showFrame(index) {
  currentIndex = index;
  const targetOpacity = document.getElementById("radarOpacity").value / 100;

  radarOverlays.forEach((ov, i) => {
    ov.setOpacity(i === currentIndex ? targetOpacity : 0);
  });

  document.getElementById("tlSlider").value = currentIndex;
  
  const f = manifest.frames[currentIndex];
  const time = new Date(f.t * 1000);
  const timeStr = String(time.getHours()).padStart(2, '0') + ":" + String(time.getMinutes()).padStart(2, '0');
  
  document.getElementById("tlTime").textContent = timeStr + " น.";
  const tag = document.getElementById("tlTag");
  
  if (f.kind === "nowcast") {
    tag.textContent = "พยากรณ์ +" + f.offset_min + " นาที";
    tag.className = "tl-tag fc";
  } else {
    tag.textContent = f.offset_min === 0 ? "ตรวจวัดจริง (ล่าสุด)" : f.offset_min + " นาที";
    tag.className = "tl-tag obs";
  }
}

// อัปเดตสถานะหัวเว็บ
function updateStatus() {
  const nowFrame = manifest.frames.find(f => f.offset_min === 0) || manifest.frames[0];
  const ageMin = Math.round((Date.now() / 1000 - nowFrame.t) / 60);
  const dot = document.getElementById("freshDot");
  dot.className = "dot" + (ageMin > 25 ? " warn" : "");
  document.getElementById("freshTime").textContent = "อัปเดตเมื่อ " + ageMin + " นาทีที่แล้ว";
}

// คำนวณ ETA คร่าวๆ
function updateETA() {
  const motion = manifest.motion;
  const spd = motion.speed_kmh || 0;
  const deg = motion.direction_deg || 0;
  
  if (spd > 3) {
    document.getElementById("etaMinutes").innerHTML = `${spd.toFixed(0)}<small>กม./ชม.</small>`;
    document.getElementById("etaDesc").textContent = `กลุ่มฝนเคลื่อนที่ไปทางทิศ ${deg.toFixed(0)}° ด้วยความเร็ว ${spd.toFixed(1)} กม./ชม.`;
  } else {
    document.getElementById("etaMinutes").textContent = "คงที่";
    document.getElementById("etaDesc").textContent = "กลุ่มฝนเคลื่อนที่ช้ามากหรือก่อตัวอยู่กับที่";
  }
}

// ตัวควบคุม Timeline
document.getElementById("tlSlider").addEventListener("input", (e) => {
  showFrame(parseInt(e.target.value));
});

document.getElementById("btnPlay").addEventListener("click", () => {
  isPlaying = !isPlaying;
  const btn = document.getElementById("btnPlay");
  if (isPlaying) {
    btn.textContent = "⏸";
    playTimer = setInterval(() => {
      let next = (currentIndex + 1) % manifest.frames.length;
      showFrame(next);
    }, 800);
  } else {
    btn.textContent = "▶";
    clearInterval(playTimer);
  }
});

// ปรับความโปร่งใส
document.getElementById("radarOpacity").addEventListener("input", (e) => {
  const targetOpacity = e.target.value / 100;
  radarOverlays[currentIndex].setOpacity(targetOpacity);
});

// สลับ Basemap
document.querySelectorAll(".map-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".map-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    const layerKey = btn.dataset.layer;
    Object.values(baseLayers).forEach(layer => map.removeLayer(layer));
    baseLayers[layerKey].addTo(map);
  });
});

// ดึงพิกัดผู้ใช้
document.getElementById("btnLoc").addEventListener("click", () => {
  if (!navigator.geolocation) return alert("เบราว์เซอร์ไม่รองรับ GPS");
  navigator.geolocation.getCurrentPosition((pos) => {
    const userLat = pos.coords.latitude;
    const userLon = pos.coords.longitude;
    map.setView([userLat, userLon], 10);
    L.marker([userLat, userLon]).addTo(map).bindPopup("ตำแหน่งของคุณ").openPopup();
    document.getElementById("userLocLabel").textContent = "ตำแหน่งของคุณ";
  }, () => {
    alert("ไม่สามารถเข้าถึงตำแหน่งได้");
  });
});

initRadar();
</script>
</body>
</html>
