<style>
:root {
  --card: rgba(15, 23, 42, 0.92);
  --card-solid: #0F172A;
  --card-line: rgba(255, 255, 255, 0.12);
  --text: #F8FAFC;
  --text-dim: #94A3B8;
  --accent: #38BDF8;
  --warn: #F59E0B;
  --ok: #10B981;
  --danger: #EF4444;
  --purple: #C084FC;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  --blur: blur(16px);

  --ring-label-bg: rgba(15, 23, 42, 0.82);
  --ring-label-border: rgba(56, 189, 248, 0.45);
  --ring-label-color: #38BDF8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; padding: 0; background: #070B12; color: var(--text); font-family: "IBM Plex Sans Thai", sans-serif; overflow: hidden; }

#map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; background: #1a202c; cursor: crosshair; }

/* Maintenance Overlay Screen */
#maintenanceOverlay {
  position: fixed; inset: 0; z-index: 99999; background: #070B12;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
}
.maint-card {
  max-width: 440px; width: 100%; padding: 32px 24px; border-radius: 20px;
  background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(56, 189, 248, 0.25);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px);
}
.maint-icon-box {
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3);
  display: grid; place-items: center; margin: 0 auto 16px auto; color: var(--accent);
}
.maint-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.maint-desc { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; margin-bottom: 24px; }
.maint-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
  background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3);
  color: #FBBF24; font-size: 12px; font-weight: 600; font-family: "IBM Plex Mono", monospace;
}

.glass {
  background: var(--card); border: 1px solid var(--card-line);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow); border-radius: 14px;
}

/* Tooltips & Popups */
.leaflet-tooltip.ring-label {
  background: var(--ring-label-bg) !important; border: 1px solid var(--ring-label-border) !important;
  color: var(--ring-label-color) !important; border-radius: 999px !important; padding: 2px 10px !important;
  font-family: "IBM Plex Mono", monospace !important; font-size: 11px !important; font-weight: 600 !important;
}
.leaflet-tooltip.ring-label::before { display: none !important; }

.leaflet-popup-content-wrapper {
  background: rgba(18, 24, 38, 0.96) !important; backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(255, 255, 255, 0.16) !important; border-radius: 12px !important; color: var(--text) !important;
}
.leaflet-popup-content { margin: 12px 14px !important; font-family: "IBM Plex Sans Thai", sans-serif !important; }
.leaflet-popup-tip { background: rgba(18, 24, 38, 0.96) !important; }

/* Custom Pins */
.custom-pin-wrap { background: transparent !important; border: none !important; }
.modern-pin { position: relative; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: grab; }
.pin-core {
  width: 13px; height: 13px; background: #38BDF8; border: 2px solid #FFFFFF; border-radius: 50%;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); z-index: 2;
}
.pin-pulse {
  position: absolute; width: 30px; height: 30px; background: rgba(56, 189, 248, 0.4); border-radius: 50%;
  animation: pin-radar-wave 2s infinite cubic-bezier(0.1, 0.7, 0.3, 1); z-index: 1;
}
@keyframes pin-radar-wave { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

.gauge-pin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.6); cursor: pointer; }

/* Layout Elements */
.lucide-icon { display: inline-flex; align-items: center; justify-content: center; }
.icon-xs { width: 12px; height: 12px; }
.icon-sm { width: 15px; height: 15px; }
.icon-md { width: 18px; height: 18px; }

.top-bar { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.top-bar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; }
.brand b { font-size: 14px; color: var(--accent); }
.brand span { font-size: 12px; color: var(--text-dim); }

.map-switch { display: flex; gap: 2px; padding: 3px; border-radius: 999px; margin-left: auto; }
.map-btn { border: none; background: transparent; color: var(--text-dim); padding: 5px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 500; cursor: pointer; }
.map-btn.active { background: var(--accent); color: #070B12; font-weight: 700; }

.btn-open-telemetry {
  background: rgba(16, 185, 129, 0.18); border: 1px solid rgba(16, 185, 129, 0.4);
  color: #34D399; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 11.5px;
}

.telemetry-panel {
  position: absolute; top: 62px; right: 12px; bottom: 90px; width: 360px; z-index: 1001;
  display: none; flex-direction: column; padding: 16px; border-radius: 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.7);
}
.telemetry-panel.open { display: flex; }
.tp-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; margin-bottom: 10px; }
.tp-title { font-size: 14px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
.tp-close-btn { background: rgba(255, 255, 255, 0.08); border: none; color: var(--text-dim); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.tp-tabs { display: flex; gap: 4px; background: rgba(0, 0, 0, 0.35); padding: 3px; border-radius: 8px; margin-bottom: 10px; }
.tp-tab-btn { flex: 1; border: none; background: transparent; color: var(--text-dim); font-size: 11px; padding: 6px 2px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.tp-tab-btn.active { background: var(--accent); color: #070B12; font-weight: 700; }
.tp-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.tp-item {
  display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06); padding: 8px 10px; border-radius: 10px; cursor: pointer;

.tp-rank { font-size: 12px; font-weight: 700; color: var(--text-dim); width: 22px; text-align: center; font-family: "IBM Plex Mono", monospace; }

.tp-st-name { font-size: 12px; font-weight: 600; color: #fff; }

.lg-bar { height: 7px; border-radius: 4px; margin: 3px 0; background: linear-gradient(90deg, #02ab02 0%, #22ce22 25%, #ffff00 50%, #ff8c00 75%, #ff0000 100%); }
.lg-labels { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-dim); font-family: "IBM Plex Mono", monospace; }

.timeline-container { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 24px)); z-index: 1000; }
.tl-card { padding: 10px 16px; border-radius: 16px; }
.tl-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 6px; margin-bottom: 8px; }
.tl-title { font-size: 13px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 6px; }
.tl-collapse-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 2px 5px; border-radius: 6px; }
.tl-main-row { display: flex; align-items: center; gap: 12px; }
.btn-play-sm { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--accent); color: #070B12; display: grid; place-items: center; cursor: pointer; flex: none; }
.tl-slider { flex: 1; accent-color: var(--accent); cursor: pointer; }
.tl-badges { display: flex; align-items: center; gap: 8px; flex: none; }
.badge-tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; font-weight: 500; }
.badge-tag.nowcast { background: rgba(245, 158, 11, 0.2); color: #FBBF24; }
.badge-tag.present { background: rgba(56, 189, 248, 0.2); color: var(--accent); font-weight: 700; }

@media (max-width: 768px) {
  .top-bar { top: 8px; left: 8px; right: 8px; gap: 6px; }

  .brand span { display: none !important; }
  .map-switch { margin-left: auto; padding: 2px; height: 32px; max-width: calc(100vw - 110px); overflow-x: auto; }
  .map-btn { padding: 4px 9px; font-size: 11px; }
  .btn-open-telemetry { position: fixed !important; top: 48px; right: 98px; height: 28px; padding: 0 9px; font-size: 11px; z-index: 1000; border-radius: 999px; }
  .timeline-container { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 16px); }
  .legend { display: none; }
}

<body>

<div id="maintenanceOverlay" style="display: none;">

<script>
const urlParams = new URLSearchParams(window.location.search);
const isDevMode = urlParams.get('dev') === 'true' || urlParams.get('admin') === '1' || window.location.hostname === 'localhost';

if (isDevMode) {
  document.addEventListener("DOMContentLoaded", () => {
    const overlay = document.getElementById("maintenanceOverlay");
    if (overlay) overlay.style.display = "none";
  });
}

const MANIFEST_URL = "nowcast/PHS/latest.json";
const R_EARTH = 6371.0088;
const THAI_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

const TELEMETRY_STATIONS = [
  { id: "PHS01", name: "สถานีอุตุนิยมวิทยาพิษณุโลก", tb: "ในเมือง", ap: "เมือง", pv: "พิษณุโลก", lat: 16.782, lon: 100.264 },
  { id: "PHS02", name: "สถานีโทรมาตร ม.นเรศวร", tb: "ท่าโพธิ์", ap: "เมือง", pv: "พิษณุโลก", lat: 16.745, lon: 100.193 },
  { id: "PHS03", name: "สถานีเขื่อนแควน้อยบำรุงแดน", tb: "คันโช้ง", ap: "วัดโบสถ์", pv: "พิษณุโลก", lat: 17.186, lon: 100.418 },
  { id: "PHS04", name: "สถานีโทรมาตร อ.วังทอง", tb: "วังทอง", ap: "วังทอง", pv: "พิษณุโลก", lat: 16.815, lon: 100.435 },
  { id: "SKT01", name: "สถานีอุตุนิยมวิทยาสุโขทัย", tb: "ปากแคว", ap: "เมือง", pv: "สุโขทัย", lat: 17.013, lon: 99.824 },
  { id: "PCT01", name: "สถานีอุตุนิยมวิทยาพิจิตร", tb: "ในเมือง", ap: "เมือง", pv: "พิจิตร", lat: 16.442, lon: 100.354 },
  { id: "UTD01", name: "สถานีอุตุนิยมวิทยาอุตรดิตถ์", tb: "ท่าอิฐ", ap: "เมือง", pv: "อุตรดิตถ์", lat: 17.618, lon: 100.098 },
  { id: "PBN01", name: "สถานีอุตุนิยมวิทยาเพชรบูรณ์", tb: "สะเดียง", ap: "เมือง", pv: "เพชรบูรณ์", lat: 16.425, lon: 101.156 },
  { id: "KPT01", name: "สถานีอุตุนิยมวิทยากำแพงเพชร", tb: "สระแก้ว", ap: "เมือง", pv: "กำแพงเพชร", lat: 16.483, lon: 99.521 },
  { id: "TAK01", name: "สถานีอุตุนิยมวิทยาตาก", tb: "น้ำรึม", ap: "เมือง", pv: "ตาก", lat: 16.883, lon: 99.123 }
];

let manifest = null;
let radarOverlays = [];
let frameImages = [];
let currentIndex = 0;
let isPlaying = false;
let playTimer = null;
let radarBounds = null;
let radarStationLatLon = [16.7765, 100.2161];
let stationMarkerInstances = [];

const map = L.map("map", { center: [16.7765, 100.2161], zoom: 8, zoomControl: false });
const tileLayers = {
  dark: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }).addTo(map),
  hillshade: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }),
  satellite: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }),
  light: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 })
};
L.control.zoom({ position: "bottomright" }).addTo(map);

const layerStations = L.layerGroup().addTo(map);

const SCAN_RES = 241;
const scanCanvas = document.createElement("canvas");
scanCanvas.width = SCAN_RES; scanCanvas.height = SCAN_RES;
const scanCtx = scanCanvas.getContext("2d", { willReadFrequently: true });

function safeLucide() {
  try {
    if (window.lucide && typeof lucide.createIcons === "function") {
      lucide.createIcons();
    }
  } catch (e) {}
}

// AEQD (Azimuthal Equidistant) Projection Forward & Inverse
function unproject(E, Nn, lat0, lon0) {
  const p0 = lat0 * Math.PI / 180, l0 = lon0 * Math.PI / 180;
  const rho = Math.hypot(E, Nn);
  if (rho < 1e-9) return [lat0, lon0];
  const c = rho / R_EARTH;
  const lat = Math.asin(Math.cos(c) * Math.sin(p0) + Nn * Math.sin(c) * Math.cos(p0) / rho);
  const lon = l0 + Math.atan2(E * Math.sin(c), rho * Math.cos(p0) * Math.cos(c) - Nn * Math.sin(p0) * Math.sin(c));
  return [lat * 180 / Math.PI, lon * 180 / Math.PI];
}

function project(lat, lon, lat0, lon0) {
  const p = lat * Math.PI / 180, l = lon * Math.PI / 180;
  const p0 = lat0 * Math.PI / 180, l0 = lon0 * Math.PI / 180;
  const cosC = Math.sin(p0) * Math.sin(p) + Math.cos(p0) * Math.cos(l - l0) * Math.cos(p);
  const c = Math.acos(Math.min(1, Math.max(-1, cosC)));
  if (c < 1e-9) return [0, 0];
  const k = c / Math.sin(c);
  const E = R_EARTH * k * Math.cos(p) * Math.sin(l - l0);
  const Nn = R_EARTH * k * (Math.cos(p0) * Math.sin(p) - Math.sin(p0) * Math.cos(p) * Math.cos(l - l0));
  return [E, Nn];
}

function formatThaiDateTime(dateObj, showFull = false) {
  const d = dateObj.getDate();
  const m = THAI_MONTHS[dateObj.getMonth()];
  const y = (dateObj.getFullYear() + 543) % 100;
  const yFull = dateObj.getFullYear() + 543;
  const hh = String(dateObj.getHours()).padStart(2, '0');
  const mm = String(dateObj.getMinutes()).padStart(2, '0');
  if (showFull) return `${d} ${m} ${yFull} เวลา ${hh}:${mm} น.`;
  return `${d} ${m} ${y} ${hh}:${mm} น.`;
}

function rgbToDbz(r, g, b, a) {
  if (a < 35) return 0;
  if (r > 200 && g > 200 && b > 200) return 56;
  if (r > 200 && g < 50) return 50;
  if (r > 200 && g > 100) return 40;
  if (g > 150) return 25;
  if (b > 150) return 15;
  return 0;
}

function dbzToRainRate(dbz) {
  if (dbz < 15) return 0;
  const z = Math.pow(10, dbz / 10);
  return Math.pow(z / 250, 1 / 1.2);
}

function initTelemetryStationMarkers() {
  layerStations.clearLayers();
  stationMarkerInstances = [];
  TELEMETRY_STATIONS.forEach((st, idx) => {
    const stationIcon = L.divIcon({
      className: "", html: `<div class="gauge-pin" id="gpin-${idx}" style="background: #64748B;"></div>`,
      iconSize: [10, 10], iconAnchor: [5, 5]
    });
    const marker = L.marker([st.lat, st.lon], { icon: stationIcon }).addTo(layerStations);
    stationMarkerInstances.push({ data: st, idx: idx, marker: marker, rain1h: 0, dbz: 0 });
  });
}

function updateTelemetryStationValues() {
  if (!manifest || !manifest.frames || stationMarkerInstances.length === 0 || frameImages.length === 0) return;
  const lat0 = radarStationLatLon[0], lon0 = radarStationLatLon[1];
  const extent = manifest.extent_m || [-240000, -240000, 240000, 240000];
  const xmin = extent[0], ymin = extent[1], xmax = extent[2], ymax = extent[3];
  
  const imgFrame = frameImages[currentIndex];
  if (!imgFrame || !imgFrame.complete || imgFrame.naturalWidth === 0) return;

  scanCtx.clearRect(0, 0, SCAN_RES, SCAN_RES);
  try {
    scanCtx.drawImage(imgFrame, 0, 0, SCAN_RES, SCAN_RES);
  } catch (e) { return; }

  let imgData = null;
  try { imgData = scanCtx.getImageData(0, 0, SCAN_RES, SCAN_RES).data; } catch (err) { return; }

  stationMarkerInstances.forEach(item => {
    const st = item.data;
    const [pinE, pinN] = project(st.lat, st.lon, lat0, lon0);
    const px = Math.round((pinE - xmin) / (xmax - xmin) * (SCAN_RES - 1));
    const py = Math.round((ymax - pinN) / (ymax - ymin) * (SCAN_RES - 1));
    let dbz = 0;
    if (imgData && px >= 0 && px < SCAN_RES && py >= 0 && py < SCAN_RES) {
      const idx = (py * SCAN_RES + px) * 4;
      dbz = rgbToDbz(imgData[idx], imgData[idx + 1], imgData[idx + 2], imgData[idx + 3]);
    }
    item.dbz = dbz;
    item.rain1h = dbzToRainRate(dbz);
  });
  renderTelemetryPanelList();
}

function renderTelemetryPanelList() {
  const container = document.getElementById("telemetryStationList");
  if (!container) return;
  let html = "";
  stationMarkerInstances.forEach((item, index) => {
    html += `
      <div class="tp-item">
        <div class="tp-rank">${index + 1}</div>
        <div class="tp-st-info"><div class="tp-st-name">${item.data.name}</div><div class="tp-st-sub">${item.data.pv}</div></div>
        <div class="tp-st-val"><div class="tp-val-num">${item.rain1h.toFixed(1)}</div><div class="tp-val-unit">มม.</div></div>
      </div>
    `;
  });
  container.innerHTML = html;
}

async function initRadar() {
  try {
    const res = await fetch(MANIFEST_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("ไม่สามารถโหลด manifest ได้");
    
    manifest = await res.json();
    if (!manifest || !manifest.frames || !Array.isArray(manifest.frames)) {
      throw new Error("โครงสร้างไฟล์ manifest ไม่ถูกต้อง");
    }

    const mLat = /lat_0=([-\d.]+)/.exec(manifest.projection);
    const mLon = /lon_0=([-\d.]+)/.exec(manifest.projection);
    const lat0 = mLat ? parseFloat(mLat[1]) : 16.7765;
    const lon0 = mLon ? parseFloat(mLon[1]) : 100.2161;
    radarStationLatLon = [lat0, lon0];

    const extent = manifest.extent_m || [-240000, -240000, 240000, 240000];
    radarBounds = L.latLngBounds(
      unproject(extent[0], extent[1], lat0, lon0),
      unproject(extent[2], extent[3], lat0, lon0)
    );

    initTelemetryStationMarkers();
    radarOverlays = [];
    frameImages = [];

    manifest.frames.forEach((frame, idx) => {
      // frame.url เช่น "f/1788842700.png"
      const url = "nowcast/PHS/" + frame.url;
      const overlay = L.imageOverlay(url, radarBounds, { opacity: 0, interactive: false }).addTo(map);
      radarOverlays.push(overlay);

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = url;
      img.onload = () => {
        if (idx === currentIndex) updateTelemetryStationValues();
      };
      img.onerror = () => { console.warn(`⚠️ โหลดภาพไม่สำเร็จ: ${url}`); };
      frameImages.push(img);
    });

    const slider = document.getElementById("tlSlider");
    slider.max = manifest.frames.length - 1;

    const presentIdx = manifest.frames.findIndex(f => f.kind === "present" || f.offset_min === 0);
    showFrame(presentIdx >= 0 ? presentIdx : Math.floor(manifest.frames.length / 2));
  } catch (err) {
    console.error("Radar Init Error:", err);
    document.getElementById("tlFullTitle").textContent = "เชื่อมต่อฐานข้อมูลเรดาร์ล้มเหลว (กำลังลองใหม่...)";
  }
}

function showFrame(index) {
  if (!manifest || !manifest.frames) return;
  currentIndex = index;

  radarOverlays.forEach((ov, i) => {
    ov.setOpacity(i === currentIndex ? 0.85 : 0);
  });

  document.getElementById("tlSlider").value = currentIndex;
  updateTelemetryStationValues();

  const f = manifest.frames[currentIndex];
  const frameDate = new Date(f.t * 1000);

  document.getElementById("tlFullTitle").innerHTML = `
    <i data-lucide="activity" class="icon-xs" style="color: var(--accent);"></i>
    <span>ทันฝน เรดาร์พิษณุโลก (Nowcast) — <b>${formatThaiDateTime(frameDate, true)}</b></span>
  `;

  const badgeEl = document.getElementById("tlBadge");
  badgeEl.className = "badge-tag " + (f.kind || "past");
  if (f.kind === "present") {
    badgeEl.textContent = "ภาพปัจจุบัน";
  } else if (f.kind === "nowcast") {
    badgeEl.textContent = `พยากรณ์ +${f.offset_min} นาที`;
  } else {
    badgeEl.textContent = f.offset_min < 0 ? `${f.offset_min} นาที` : "ตรวจวัดจริง";
  }

  document.getElementById("tlFrameCount").textContent = `เฟรม ${currentIndex + 1}/${manifest.frames.length}`;
  document.getElementById("tlLatestTime").textContent = `ข้อมูลตรวจวัดล่าสุด: ${formatThaiDateTime(new Date(manifest.generated * 1000), true)}`;
  safeLucide();
}

function togglePlay() {
  if (!manifest || !manifest.frames || !Array.isArray(manifest.frames)) return;
  isPlaying = !isPlaying;
  const playIcon = document.getElementById("playIcon");

  if (isPlaying) {
    if (playIcon) playIcon.setAttribute("data-lucide", "pause");
    playTimer = setInterval(() => {
      if (!manifest || !manifest.frames) { togglePlay(); return; }
      let next = (currentIndex + 1) % manifest.frames.length;
      showFrame(next);
    }, 800);
  } else {
    if (playIcon) playIcon.setAttribute("data-lucide", "play");
    clearInterval(playTimer);
  }
  safeLucide();
}

document.getElementById("btnPlay").addEventListener("click", togglePlay);
document.getElementById("tlSlider").addEventListener("input", (e) => { showFrame(parseInt(e.target.value)); });
document.getElementById("btnToggleTelemetryPanel").addEventListener("click", () => { document.getElementById("telemetryPanel").classList.toggle("open"); });
document.getElementById("btnCloseTelemetryPanel").addEventListener("click", () => { document.getElementById("telemetryPanel").classList.remove("open"); });

document.querySelectorAll(".map-btn").forEach(btn => {
  btn.addEventListener("click", (e) => {
    document.querySelectorAll(".map-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    const layerKey = e.target.getAttribute("data-layer");
    Object.keys(tileLayers).forEach(k => {
      if (k === layerKey) {
        tileLayers[k].addTo(map);
      } else {
        map.removeLayer(tileLayers[k]);
      }
    });
  });
});

setInterval(async () => {
  try {
    const res = await fetch(MANIFEST_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (data && data.frames && Array.isArray(data.frames)) {
        manifest = data;
        updateTelemetryStationValues();
      }
    }
  } catch (e) {}
}, 180000);

initRadar();
safeLucide();
</script>
</body>
</html>
